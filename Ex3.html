<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3</title>
</head>
<style>
    .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    header,
    footer {
        display: flex;
        padding: 20px;
        color: white;
        background-color: black;
        justify-content: center;
    }

    main {
        padding: 15px;
        color: black;
        background-color: gainsboro;
        margin: 0 15px;
    }

    aside {
        padding: 15px;
        color: black;
        background-color: gray;
        margin: 0 15px;
    }

    @media(min-width: 600px) {
        .container {
            flex-direction: row;
            flex-wrap: wrap;
        }

        header,
        footer {
            width: 100%;
            padding: 15px;
        }

        main,
        aside {
            padding: 10px;
        }

        main {
            flex: 1;
            margin: 0 0 0 15px;
        }

        aside {
            flex: 1;
            margin: 0 15px 0 0;
        }
    }

    @media(min-width:900px) {

        main {
            flex: 3;
        }

        aside {
            flex: 1;
        }
    }
</style>

<body>
    <div class="container">
        <header>Responsive Header</header>
        <main>Main Content</main>
        <aside>Sidebar</aside>
        <footer>Footer</footer>
    </div>
</body>

</html>
